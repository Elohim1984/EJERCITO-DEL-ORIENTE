<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Control Escolar</title>
<link rel="icon" href="escudo.png" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icono-180.png" />
<meta name="theme-color" content="#551313" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700;9..144,800&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilos.css" />
<link rel="stylesheet" href="control-escolar.css" />
<script src="config.js"></script>
<script src="datos.js"></script>
</head>
<body>

<div id="gate">
  <div class="gate-card">
    <div class="tile-rule"></div>
    <div class="gate-body">
      <img class="crest" src="escudo.png" alt="Logo de Telesecundarias Puebla" />
      <div class="gate-eyebrow">Solo personal de la escuela</div>
      <h1 class="gate-title">Control Escolar</h1>
      <p class="gate-sub" id="gate-sub">Escriba la clave para entrar.</p>
      <form class="gate-form" id="form-entrada">
        <label class="gate-label" for="codigo">Clave de acceso</label>
        <input id="codigo" class="mono" type="password" autocomplete="off" placeholder="••••••••" />
        <label class="recordar"><input type="checkbox" id="recordar" checked /> Recordarme en este dispositivo</label>
        <button class="gate-btn" type="submit" id="btn-entrar">Entrar</button>
        <div class="gate-error" id="gate-error" role="alert"></div>
      </form>
      <p class="gate-note"><a href="index.html">Volver al portal</a></p>
    </div>
  </div>
</div>

<div id="portal">
  <header class="band ce-band">
    <div class="band-inner">
      <div class="band-top">
        <img class="band-crest" src="escudo.png" alt="Logo de Telesecundarias Puebla" />
        <div>
          <div class="band-eyebrow">Control Escolar &middot; ciclo <span id="ciclo"></span></div>
          <h1 id="titulo-escuela">Control Escolar</h1>
        </div>
      </div>
      <div class="ce-band-acciones">
        <a class="band-config" href="index.html">&larr; Portal</a>
        <button class="band-config" id="btn-salir" type="button">Salir</button>
      </div>
    </div>
  </header>

  <nav class="ce-nav" id="nav-grupos" aria-label="Secciones"></nav>
  <nav class="ce-subnav" id="nav-tabs" aria-label="Pestañas" hidden></nav>
  <div class="tile-rule"></div>

  <main class="ce-main">
    <div id="vista"></div>
  </main>
</div>

<div id="toast" class="ce-toast" role="status" aria-live="polite"></div>

<script src="ce-nucleo.js"></script>
<script src="ce-alumnos.js"></script>
<script src="ce-secciones.js"></script>
<script>CE.iniciar();</script>
</body>
</html>
